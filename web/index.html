// ---------------------------------------------------- Financial Statements Tab
async function renderFinancialStatementsTab() {
  const currentYear = new Date().getFullYear();
  if (!window._repFrom) window._repFrom = `${currentYear}-01-01`;
  if (!window._repTo) window._repTo = `${currentYear}-12-31`;
  if (!window._fsTab) window._fsTab = "st1"; // st1 | st2 | st3 | st4
  if (!window._fsCitRate) window._fsCitRate = "1";

  // Calculate previous year dates for comparative columns
  const fromYear = parseInt(window._repFrom.split('-')[0], 10);
  const prevYearFrom = `${fromYear - 1}-01-01`;
  const prevYearTo = `${fromYear - 1}-12-31`;

  const [bs, inc, eq, cf, prevBs, prevInc] = await Promise.all([
    api(`/companies/${companyId}/balance-sheet?as_of=${window._repTo}`),
    api(`/companies/${companyId}/income-statement?date_from=${window._repFrom}&date_to=${window._repTo}`),
    api(`/companies/${companyId}/equity-statement?date_from=${window._repFrom}&date_to=${window._repTo}`).catch(() => null),
    api(`/companies/${companyId}/cash-flow?date_from=${window._repFrom}&date_to=${window._repTo}`).catch(() => null),
    api(`/companies/${companyId}/balance-sheet?as_of=${prevYearTo}`).catch(() => null),
    api(`/companies/${companyId}/income-statement?date_from=${prevYearFrom}&date_to=${prevYearTo}`).catch(() => null)
  ]);

  const findBsRow = (data, name) => {
    if (!data) return null;
    const arrays = [data.assets, data.liabilities, data.equity];
    for (const arr of arrays) {
      if (arr) {
        const item = arr.find(x => x.name.includes(name));
        if (item) return item;
      }
    }
    return null;
  };

  const getVal = (data, name) => {
    const row = findBsRow(data, name);
    return row ? row.amount_minor : 0;
  };

  // Мөрийн дотоод дансны задаргаа (dropdown-д харуулна).
  // Тайлант үеийн дүнг bs-ээс, харьцуулах баганыг prevBs-ээс авна.
  const getAccounts = (name) => {
    const cur = findBsRow(bs, name);
    const prev = findBsRow(prevBs, name);
    const merged = new Map();
    (cur && cur.accounts ? cur.accounts : []).forEach(a => {
      merged.set(a.code, { code: a.code, name: a.name, cur: a.amount_minor, prev: 0 });
    });
    (prev && prev.accounts ? prev.accounts : []).forEach(a => {
      const row = merged.get(a.code);
      if (row) row.prev = a.amount_minor;
      else merged.set(a.code, { code: a.code, name: a.name, cur: 0, prev: a.amount_minor });
    });
    return [...merged.values()].sort((x, y) => x.code.localeCompare(y.code));
  };

  // Хэд хэдэн мөрийн задаргааг нийлүүлж, нийлбэр мөрийн dropdown болгоно
  const mergeAccounts = (...names) => {
    const merged = new Map();
    names.forEach(n => getAccounts(n).forEach(a => {
      const row = merged.get(a.code);
      if (row) { row.cur += a.cur; row.prev += a.prev; }
      else merged.set(a.code, { ...a });
    }));
    return [...merged.values()].sort((x, y) => x.code.localeCompare(y.code));
  };

  // Орлогын тайлангийн мөрийн задаргаа (breakdown.revenue / cogs / expenses)
  const getIncAccounts = (key, sign = 1) => {
    const cur = (inc && inc.breakdown && inc.breakdown[key]) || [];
    const prev = (prevInc && prevInc.breakdown && prevInc.breakdown[key]) || [];
    const merged = new Map();
    cur.forEach(a => merged.set(a.code, {
      code: a.code, name: a.name, cur: sign * a.amount_minor, prev: 0
    }));
    prev.forEach(a => {
      const row = merged.get(a.code);
      if (row) row.prev = sign * a.amount_minor;
      else merged.set(a.code, { code: a.code, name: a.name, cur: 0, prev: sign * a.amount_minor });
    });
    return [...merged.values()].sort((x, y) => x.code.localeCompare(y.code));
  };

  const mergeIncAccounts = (...specs) => {
    const merged = new Map();
    specs.forEach(([key, sign]) => getIncAccounts(key, sign).forEach(a => {
      const row = merged.get(a.code);
      if (row) { row.cur += a.cur; row.prev += a.prev; }
      else merged.set(a.code, { ...a });
    }));
    return [...merged.values()].sort((x, y) => x.code.localeCompare(y.code));
  };

  const getIncVal = (data, name) => {
    if (!data) return 0;
    if (name === 'revenue') return data.revenue_minor || 0;
    if (name === 'other') return data.other_income_minor || 0;
    if (name === 'cogs') return data.cogs_minor || 0;
    if (name === 'gross') return data.gross_profit_minor || 0;
    if (name === 'exp') return data.expenses_minor || 0;
    // Дэвтэрт ОАТ хуримтлуулаагүй тул backend-ийн цэвэр ашиг = татварын өмнөх ашиг
    if (name === 'pretax' || name === 'net') return data.net_income_minor || 0;
    return 0;
  };

  // ОАТ нь дэвтэрт бичигдээгүй, дэлгэц дээр тооцоолсон дүн
  const citRate = parseInt(window._fsCitRate, 10) / 100;
  const estCit = (v) => v > 0 ? Math.round(v * citRate) : 0;
  const citCur = estCit(getIncVal(inc, "pretax"));
  const citPrev = estCit(getIncVal(prevInc, "pretax"));

  // Татварын өмнөх ашгийг бүрдүүлэгч бүх данс
  const pretaxAccounts = mergeIncAccounts(
    ["revenue", 1], ["other_income", 1], ["cogs", -1], ["expenses", -1]);

  // Цэвэр дүнгийн задаргаанд зарлагын мөрийг хасах тэмдэгтэй оруулна
  const negItem = (a) => ({ ...a, cur: -a.cur, prev: -a.prev });

  const fsEmptyCard = (title, message) => `
    <div class="card" style="padding:20px; margin-top:20px;">
      <h3 style="font-size:18px; font-weight:800; margin:0 0 10px 0;">${title}</h3>
      <p class="muted" style="margin:0;"><i class="fa-solid fa-triangle-exclamation" style="color:var(--warning)"></i> ${message}</p>
    </div>`;

  let statementHtml = "";
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // Мөр бүрийн задаргаа нээлттэй эсэхийг санана (тайлан сэлгэхэд ч хадгалагдана)
  if (!window._fsOpenRows) window._fsOpenRows = {};

  const formatComparativeRow = (rowNum, label, curVal, prevVal, isBold = false, accounts = null) => {
    const boldStyle = isBold ? 'font-weight:700; background-color:rgba(248, 250, 252, 0.05);' : '';
    const rows = (accounts || []).filter(a => a.cur || a.prev);
    const key = `${window._fsTab}|${rowNum}`;
    const isOpen = !!window._fsOpenRows[key];

    const caret = rows.length
      ? `<i class="fa-solid fa-chevron-right" data-fs-caret="${esc(key)}" style="font-size:10px; width:12px; margin-right:8px; color:var(--primary); transition:transform .18s; transform:rotate(${isOpen ? 90 : 0}deg);"></i>`
      : `<span style="display:inline-block; width:20px;"></span>`;

    const badge = rows.length

      : '';

    const main = `
      <tr style="${boldStyle} border-bottom:1px solid var(--border); ${rows.length ? 'cursor:pointer;' : ''}"
          ${rows.length ? `onclick="toggleFsRow('${esc(key)}')" title="Дансны задаргааг харах"` : ''}>
        <td style="padding:10px 14px; text-align:center; width:80px; font-weight:600; color:var(--text-muted);">${rowNum}</td>
        <td style="padding:10px 14px; ${isBold ? 'font-weight:700;' : ''}">${caret}${label}${badge}</td>
        <td class="num" style="padding:10px 14px; text-align:right;">${prevVal ? fmt(prevVal) : '-'}</td>
        <td class="num" style="padding:10px 14px; text-align:right; ${isBold ? 'font-weight:800;' : ''}">${curVal ? fmt(curVal) : '-'}</td>
      </tr>
    `;

    const children = rows.map(a => `
      <tr data-fs-detail="${esc(key)}" style="display:${isOpen ? '' : 'none'}; background:rgba(148,163,184,.06); border-bottom:1px solid var(--border);">
        <td style="padding:7px 14px; text-align:center; font-size:12px; font-weight:700; color:var(--primary);">${esc(a.code)}</td>
        <td style="padding:7px 14px 7px 42px; font-size:12.5px; color:var(--text-muted);">
          <a href="javascript:void(0)" onclick="event.stopPropagation(); fsDrillAccount('${esc(a.code)}')"
             style="color:inherit; text-decoration:none; border-bottom:1px dashed var(--border-dark);"
             title="Гүйлгээний баланс дээр энэ дансыг харах">${esc(a.name)}</a>
        </td>
        <td class="num" style="padding:7px 14px; text-align:right; font-size:12.5px; color:var(--text-muted);">${a.prev ? fmt(a.prev) : '-'}</td>
        <td class="num" style="padding:7px 14px; text-align:right; font-size:12.5px;">${a.cur ? fmt(a.cur) : '-'}</td>
      </tr>
    `).join('');

    return main + children;
  };

  if (window._fsTab === "st1") {
    statementHtml = `
      <div class="card" style="padding:20px; margin-top:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
          <div>
            <h3 style="font-size:18px; font-weight:800; margin:0;">Санхүүгийн байдлын тайлан (Баланс)</h3>
            <p class="muted" style="margin-top:2px;">Сангийн Сайдын 2017 оны 361 дүгээр тушаалын хавсралт СТ-1 · Мөр дээр дарж дансны задаргааг харна</p>
          </div>
          <div style="display:flex; gap:8px;">

            <button class="btn secondary" onclick="toggleAllFsRows(false)"><i class="fa-solid fa-angles-up"></i> Хураах</button>
            <button class="btn secondary" onclick="window.print()"><i class="fa-solid fa-print"></i> Хэвлэх</button>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table style="width:100%; border-collapse:collapse; font-size:13.5px;">
            <thead>
              <tr style="background-color: var(--border); border-bottom: 2px solid var(--border-dark)">
                <th style="padding:10px 14px; text-align:center;">Мөрийн дугаар</th>
                <th style="padding:10px 14px; text-align:left;">Үзүүлэлт</th>
                <th style="padding:10px 14px; text-align:right; width:220px;">${fromYear - 1} оны 12-р сарын 31</th>

              </tr>
            </thead>
            <tbody>
              <tr style="font-weight:700; background-color: var(--border);"><td style="padding:8px 14px;" colspan="4">1. ХӨРӨНГӨ</td></tr>
              ${formatComparativeRow("1.1.1", "Мөнгө ба түүнтэй адилтгах хөрөнгө", getVal(bs, "Мөнгө"), getVal(prevBs, "Мөнгө"), false, getAccounts("Мөнгө"))}
              ${formatComparativeRow("1.1.2", "Дансны авлага", getVal(bs, "Дансны авлага"), getVal(prevBs, "Дансны авлага"), false, getAccounts("Дансны авлага"))}
              ${formatComparativeRow("1.1.3", "Татвар, НДШ-ийн авлага", getVal(bs, "Татвар, НДШ-ийн авлага"), getVal(prevBs, "Татвар, НДШ-ийн авлага"), false, getAccounts("Татвар, НДШ-ийн авлага"))}
              ${formatComparativeRow("1.1.4", "Бараа материал", getVal(bs, "Бараа материал"), getVal(prevBs, "Бараа материал"), false, getAccounts("Бараа материал"))}
              ${formatComparativeRow("1.1.5", "Урьдчилж төлсөн зардал, хангамж", getVal(bs, "Урьдчилж төлсөн зардал"), getVal(prevBs, "Урьдчилж төлсөн зардал"), false, getAccounts("Урьдчилж төлсөн зардал"))}
              ${formatComparativeRow("1.1.0", "Эргэлтийн хөрөнгийн дүн",
                  getVal(bs, "Мөнгө") + getVal(bs, "Дансны авлага") + getVal(bs, "Татвар, НДШ-ийн авлага") + getVal(bs, "Бараа материал") + getVal(bs, "Урьдчилж төлсөн зардал"),
                  getVal(prevBs, "Мөнгө") + getVal(prevBs, "Дансны авлага") + getVal(prevBs, "Татвар, НДШ-ийн авлага") + getVal(prevBs, "Бараа материал") + getVal(prevBs, "Урьдчилж төлсөн зардал"), true,
                  mergeAccounts("Мөнгө", "Дансны авлага", "Татвар, НДШ-ийн авлага", "Бараа материал", "Урьдчилж төлсөн зардал"))}

              ${/* Элэгдлийн данс кредит үлдэгдэлтэй тул getVal сөрөг утга буцаана — тайланд шууд хасах дүнгээр харагдана */ ''}
              ${formatComparativeRow("1.2.2", "Хуримтлагдсан элэгдэл (-)", getVal(bs, "Хуримтлагдсан элэгдэл"), getVal(prevBs, "Хуримтлагдсан элэгдэл"), false, getAccounts("Хуримтлагдсан элэгдэл"))}

                  mergeAccounts("Мөнгө", "Дансны авлага", "Татвар, НДШ-ийн авлага", "Бараа материал", "Урьдчилж төлсөн зардал", "Үндсэн хөрөнгө", "Хуримтлагдсан элэгдэл"))}

      btn.classList.add('active');

async function renderRulesTab() {
  const [rules, accounts] = await Promise.all([
    api(`/companies/${companyId}/classifier-rules`),
    api(`/companies/${companyId}/accounts`)
  ]);

  const accOptions = (accounts || []).map(a => `<option value="${a.code}">${a.code} - ${a.name}</option>`).join('');

  window.syncDefaultRules = async () => {
    if (!confirm('Системийн үндсэн ангиллын дүрмүүдийг нэмэх үү?\n\nДутуу дүрмийг нэмж, эрэмбийг зөв болгоно. Таны өөрийн үүсгэсэн дүрэм хэвээр үлдэнэ.')) return;
    try {
      const res = await post(`/companies/${companyId}/classifier-rules/sync-defaults`, {});
      alert(`${res.added} шинэ дүрэм нэмэгдэж, ${res.reordered} дүрмийн эрэмбэ шинэчлэгдлээ.\nНийт үндсэн дүрэм: ${res.total_defaults}`);
      renderRulesTab();
    } catch (e) {
      alert('Алдаа: ' + e.message);
    }
  };

  const rows = (rules || []).map(r => `
    <tr style="border-bottom:1px solid var(--border)">
      <td style="padding:10px; font-weight:700;">${r.keyword}</td>
      ${/* Банкны хуулгын талаас: credit = данс руу мөнгө ОРСОН, debit = ГАРСАН */ ''}
      <td style="padding:10px;">${r.direction === 'credit' ? '🟢 Орлого (Credit)' : r.direction === 'debit' ? '🔴 Зарлага (Debit)' : 'Бүх чиглэл'}</td>
      <td style="padding:10px;"><b>${r.account_code}</b></td>
      <td style="padding:10px;">${r.vat_flag ? '✅ Тийм' : '❌ Үгүй'}</td>
      <td style="padding:10px; text-align:center;">${r.priority}</td>
      <td style="padding:10px; text-align:center;">
        <button class="btn btn-xs secondary" style="color:var(--danger);" onclick="deleteRule('${r.id}')"><i class="fa-solid fa-trash"></i> Устгах</button>
      </td>
    </tr>
  `).join('');

  $('#content').innerHTML = `
    <div class="card" style="margin-bottom: 20px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
        <div>
          <h2><i class="fa-solid fa-list-check" style="color:var(--primary)"></i> Дансны автомат ангилалын дүрмүүд</h2>
          <p class="muted">Гүйлгээний утганд тааруулан харьцах дансыг автоматаар ангилах нябо-гийн гар дүрмүүд.</p>
        </div>
        <button class="btn secondary" onclick="syncDefaultRules()" style="white-space:nowrap;">
          <i class="fa-solid fa-arrows-rotate"></i> Үндсэн дүрмийг нэмэх
        </button>
      </div>
      ${(rules || []).length < 40 ? `
        <div style="margin-top:14px; padding:10px 14px; border-radius:8px; font-size:12.5px; line-height:1.55;
             border:1px solid var(--warning); background:rgba(245,158,11,.08);">
          <i class="fa-solid fa-lightbulb" style="color:var(--warning)"></i>
          Одоо <b>${(rules || []).length}</b> дүрэм байна. Дүрэм нь компани үүсэх агшинд суудаг тул
          өмнө нь үүсгэсэн компани шинэ дүрмийг автоматаар авдаггүй.
          <b>«Үндсэн дүрмийг нэмэх»</b> дарж дутууг нөхнө үү — дүрмээр таарсан гүйлгээ бүр AI дуудлага хэмнэнэ.
        </div>` : ''}
    </div>

    <div class="card" style="margin-bottom: 20px; padding: 20px;">
      <h3 style="font-size:14px; font-weight:700; margin-bottom:14px;"><i class="fa-solid fa-plus-circle" style="color:var(--primary)"></i> Шинэ дүрэм нэмэх</h3>
      <div class="grid-4" style="align-items:flex-end; gap:12px;">
        <div class="form-group" style="margin:0;">
          <label style="font-size:12px; margin-bottom:4px;">Түлхүүр үг (keyword)</label>
          <input type="text" id="rule_keyword" class="input-field" placeholder="утганд хайх үг...">
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:12px; margin-bottom:4px;">Харьцах данс</label>
          <select id="rule_account_code" class="input-field" style="height:38px;">
            ${accOptions}
          </select>
        </div>
        <div class="form-group" style="margin:0;">
          <label style="font-size:12px; margin-bottom:4px;">Чиглэл</label>
          <select id="rule_direction" class="input-field" style="height:38px;">
            <option value="">Бүгд</option>
            <option value="credit">Орлого — данс руу мөнгө орсон (Credit)</option>
            <option value="debit">Зарлага — данснаас мөнгө гарсан (Debit)</option>
          </select>
        </div>
        <div style="display:flex; gap:12px; align-items: center; justify-content: space-between; width: 100%;">
          <div style="display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="rule_vat_flag" style="width:18px; height:18px; cursor:pointer;">
            <label for="rule_vat_flag" style="font-size:12.5px; font-weight:600; cursor:pointer; margin:0;">НӨАТ суутгах</label>
          </div>
          <button class="btn" onclick="saveRule()" style="height:38px;"><i class="fa-solid fa-plus"></i> Нэмэх</button>
        </div>
      </div>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <div style="overflow-x:auto">
        <table data-tools style="width:100%; border-collapse:collapse; font-size:13.5px;">
          <thead>
            <tr style="background-color: var(--border); border-bottom: 2px solid var(--border-dark)">
              <th style="padding:10px; text-align:left;">Түлхүүр үг (утганд агуулагдах)</th>
              <th style="padding:10px; text-align:left;">Гүйлгээний төрөл</th>
              <th style="padding:10px; text-align:left;">Ангилах дансны код</th>
              <th style="padding:10px; text-align:left;">НӨАТ хасагдах</th>
              <th style="padding:10px; text-align:center; width:90px;">Дараалал</th>
              <th style="padding:10px; text-align:center; width:120px;">Үйлдэл</th>
            </tr>
          </thead>
          <tbody>
            ${rows || emptyRow(6, 'Ангиллын дүрэм алга',
     'Дүрэм нь AI-аас ҮРГЭЛЖ дээгүүр ажилладаг — нэг удаа зааж өгвөл тэр утгатай гүйлгээ дахин асуухгүй.',
     [{label:'Дүрэм нэмэх', icon:'fa-plus', onclick:'ruleAdd()'}], 'fa-list-check')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  window.saveRule = async () => {
    const keyword = $('#rule_keyword').value.trim();
    const account_code = $('#rule_account_code').value;
    const direction = $('#rule_direction').value || null;
    const vat_flag = $('#rule_vat_flag').checked;

    if (!keyword) return alert("Түлхүүр үгээ оруулна уу.");

    try {
      await post(`/companies/${companyId}/classifier-rules`, {
        keyword,
        direction,
        account_code,
        vat_flag,
        priority: 100
      });
      renderRulesTab();
    } catch (e) {
      alert("Хадгалах үед алдаа гарлаа: " + e.message);
    }
  };

  window.deleteRule = async (id) => {
    if (!confirm("Уг дүрмийг устгах уу?")) return;
    try {
      await api(`/companies/${companyId}/classifier-rules/${id}`, { method: 'DELETE' });
      renderRulesTab();
    } catch (e) {
      alert("Устгах үед алдаа гарлаа: " + e.message);
    }
  };
}

//
// Нябо дүн, утга бичихэд эсрэг талын дансыг систем өөрөө сонгоно.
// Ангиллын дүрэм нь ҮРГЭЛЖ дээгүүр — хэрэглэгч хүсвэл дарж өөрчилнө.

let _qeSuggestion = null;

async function quickSuggest() {
  const desc = ($('#qe_desc') || {}).value || '';
  const acc = ($('#qe_acc') || {}).value || '';
  const hint = $('#qe_hint');
  if (!hint) return;

  const s = await api(`/companies/${companyId}/suggest-counter-account` +
    `?description=${encodeURIComponent(desc)}&account_code=${encodeURIComponent(acc)}`)
    .catch(() => null);
  _qeSuggestion = s && s.code ? s : null;

  hint.innerHTML = _qeSuggestion
    ? `<i class="fa-solid fa-wand-magic-sparkles"></i> Автомат харьцах данс:
       <b>${esc(_qeSuggestion.code)} ${esc(_qeSuggestion.name)}</b>
       <span style="opacity:.7">(${esc(_qeSuggestion.reason)})</span>`
    : 'Харьцах дансыг гараар сонгоно уу.';
}

function quickAddLine() {
  const acc = $('#qe_acc').value;
  const amount = parseFloat($('#qe_amount').value || '0');
  const desc = ($('#qe_desc').value || '').trim();
  const counter = $('#qe_counter').value || (_qeSuggestion ? _qeSuggestion.code : '');

  if (!acc || !amount) { toast('Данс ба дүнг оруулна уу.', 'warn'); return; }
  if (!counter) { toast('Харьцах данс тодорхойгүй — гараар сонгоно уу.', 'warn'); return; }
  if (acc === counter) { toast('Данс ба харьцах данс ижил байна.', 'warn'); return; }

  // Зардал/хөрөнгө нэмэгдвэл дебит, орлого бол кредит талд бичигдэнэ
  const isIncome = acc[0] === '5' || acc[0] === '4';
  // Excel-ийн наах хэлбэртэй ижил: данс, дебит, кредит, тайлбар — TAB-аар
  const TAB = String.fromCharCode(9), NL = String.fromCharCode(10);
  const cols = (a, d, c) => [a, d, c, desc].join(TAB);
  const first = isIncome ? cols(acc, 0, amount) : cols(acc, amount, 0);
  const second = isIncome ? cols(counter, amount, 0) : cols(counter, 0, amount);

  const area = $('#mj_paste_area');
  area.value = (area.value.trim() ? area.value.replace(/\s+$/, '') + NL : '') + first + NL + second;
  parseExcelPaste();

  $('#qe_amount').value = '';
  $('#qe_desc').value = '';
  $('#qe_hint').innerHTML = '';
  _qeSuggestion = null;
}

function loadJournalTemplate() {
  const tempId = $('#mj_temp_select').value;
  if (!tempId) return;
  const temp = (window._journalTemplates || []).find(t => t.id === tempId);
  if (!temp) return;
  
  $('#mj_memo').value = temp.memo || '';
  
  const textLines = temp.lines.map(l => {
    const deb = l.debit_ratio > 0 ? Math.round(l.debit_ratio * 1000000) : 0;
    const cred = l.credit_ratio > 0 ? Math.round(l.credit_ratio * 1000000) : 0;
    return `${l.account_code}\t${deb}\t${cred}\t${l.description || ''}`;
  }).join('\n');
  
  $('#mj_paste_area').value = textLines;
  parseExcelPaste();
}

async function saveCurrentAsTemplate() {
  const name = prompt("Загварын нэрийг оруулна уу:");
  if (!name) return;
  
  const memo = $('#mj_memo').value.trim() || null;
  const total = parsedLines.reduce((s, r) => s + (r.debit_minor || r.credit_minor), 0) || 1;
  const linesPayload = parsedLines.map(l => ({
    account_code: l.account_code,
    debit_ratio: l.debit_minor / total,
    credit_ratio: l.credit_minor / total,
    description: l.description
  }));
  
  const res = await post(`/companies/${companyId}/journal-templates`, {
    template_name: name,
    memo,
    lines: linesPayload
  });
  
  if (res) {
    alert("Журналын бичилтийн загварыг амжилттай хадгаллаа!");
    openManualEntryModal();
  }
}

function parseExcelPaste() {
  const text = $('#mj_paste_area').value;
  const lines = text.split('\n');
  parsedLines = [];
  
  let totalDebit = 0;
  let totalCredit = 0;
  
  const accMap = {};
  (window._accounts || []).forEach(a => {
    accMap[a.code] = a;
  });
  
  let tbodyHtml = '';
  
  lines.forEach((line, idx) => {
    if (!line.trim()) return;
    const parts = line.split('\t');
    if (parts.length < 3) return;
    
    const account_code = parts[0].trim();
    const debit = Math.round(parseFloat((parts[1] || '0').replace(/,/g, '')) * 100) || 0;
    const credit = Math.round(parseFloat((parts[2] || '0').replace(/,/g, '')) * 100) || 0;
    const description = (parts[3] || '').trim();
    
    const acc = accMap[account_code];
    const accName = acc ? acc.name : `<span style="color:var(--danger)">Олдохгүй данс!</span>`;
    const accClass = acc ? '' : 'style="background-color:rgba(255,0,0,0.05);"';
    
    totalDebit += debit;
    totalCredit += credit;
    
    parsedLines.push({
      account_code,
      debit_minor: debit,
      credit_minor: credit,
      description: description || null
    });
    
    tbodyHtml += `
      <tr ${accClass}>
        <td style="padding:6px; font-family:monospace;"><b>${account_code}</b></td>
        <td style="padding:6px;">${accName}</td>
        <td class="num" style="padding:6px;">${debit > 0 ? fmt(debit) : '—'}</td>
        <td class="num" style="padding:6px;">${credit > 0 ? fmt(credit) : '—'}</td>
        <td style="padding:6px; color:var(--text-muted);">${description || '—'}</td>
      </tr>
    `;
  });
  
  if (parsedLines.length > 0) {
    $('#mj_preview_container').style.display = 'block';
    $('#mj_preview_tbody').innerHTML = tbodyHtml;
    $('#mj_total_debit').textContent = fmt(totalDebit);
    $('#mj_total_credit').textContent = fmt(totalCredit);
    
    const diff = totalDebit - totalCredit;
    const diffText = $('#mj_balance_diff');
    const saveBtn = $('#mj_save_btn');
    const saveTempBtn = $('#mj_save_temp_btn');
    
    // Check if balanced (G1) and all accounts are valid (G4)
    const allAccountsValid = parsedLines.every(l => accMap[l.account_code] && accMap[l.account_code].is_postable);
    
    saveTempBtn.removeAttribute('disabled');
    const draftBtn = $('#mj_draft_btn');
    const setEnabled = (on) => [saveBtn, draftBtn].forEach(b => b &&
      (on ? b.removeAttribute('disabled') : b.setAttribute('disabled', 'true')));

    // Амьд тэнцэл — хадгалахыг оролдох хүртэл хүлээлгэхгүй, бичиж байхад нь хэлнэ
    const foot = diffText.closest('tr');
    if (diff === 0 && totalDebit > 0) {
      if (allAccountsValid) {
        diffText.innerHTML = `<span style="color:var(--primary)"><i class="fa-solid fa-circle-check"></i> Тэнцсэн</span>`;
        if (foot) foot.style.background = 'var(--primary-light)';
        setEnabled(true);
      } else {
        diffText.innerHTML = `<span style="color:var(--danger)"><i class="fa-solid fa-triangle-exclamation"></i> Бүлэг эсвэл буруу данс байна!</span>`;
        if (foot) foot.style.background = 'var(--danger-light)';
        setEnabled(false);
      }
    } else {
      diffText.innerHTML = `<span style="color:var(--danger)"><i class="fa-solid fa-scale-unbalanced"></i>
        Тэнцэлийг шалгана уу — зөрүү ${fmt(Math.abs(diff))}</span>`;
      if (foot) foot.style.background = 'var(--danger-light)';
      setEnabled(false);
    }
  } else {
    $('#mj_preview_container').style.display = 'none';
    $('#mj_save_btn').setAttribute('disabled', 'true');
    if ($('#mj_draft_btn')) $('#mj_draft_btn').setAttribute('disabled', 'true');
    $('#mj_save_temp_btn').setAttribute('disabled', 'true');
  }
}

async function saveManualJournalEntry(status = 'posted') {
  const entry_date = $('#mj_date').value;
  const memo = $('#mj_memo').value.trim() || null;
  
  if (!entry_date) {
    alert("Гүйлгээний огноог оруулна уу.");
    return;
  }
  
  if (parsedLines.length === 0) {
    alert("Гүйлгээний мөр олдсонгүй.");
    return;
  }
  
  const body = {
    entry_date,
    memo,
    status,
    lines: parsedLines.map(l => ({
      account_code: l.account_code,
      debit_minor: l.debit_minor,
      credit_minor: l.credit_minor,
      description: l.description
    }))
  };
  
  const res = await post(`/companies/${companyId}/entries`, body);
  if (res) {
    alert(`Журналын бичилт №${res.entry_no} амжилттай бүртгэгдлээ!`);
    hideModal();
    renderTrialBalanceTab();
  }
}

// Данс сонголтыг унадаг цэсэнд нуухын оронд карт болгоно — үлдэгдэл шууд
// харагдаж, дарахад тухайн дансны контекст руу шилжинэ.

window._cashAccount = window._cashAccount || null;

function cashAccountCards(tb) {
  const rows = (Array.isArray(tb) ? tb : [])
    .filter(r => /^(10|11)/.test(r.code))
    .map(r => ({ ...r, bal: r.debit_minor - r.credit_minor }))
    .filter(r => r.bal || r.debit_minor || r.credit_minor);

  if (!rows.length) return '';

  const total = rows.reduce((a, r) => a + r.bal, 0);
  return `<div class="acc-cards">
    ${rows.map(r => `
      <button class="acc-card ${window._cashAccount === r.code ? 'active' : ''}"
              onclick="pickCashAccount('${r.code}')" title="${esc(r.name)}">
        <span class="ac-code">${esc(r.code)}</span>
        <span class="ac-name">${esc(r.name)}</span>
        <span class="ac-bal">${fmt(r.bal)}</span>
      </button>`).join('')}
    <div class="acc-card total">
      <span class="ac-code">НИЙТ</span>
      <span class="ac-name">Мөнгөн хөрөнгө</span>
      <span class="ac-bal">${fmt(total)}</span>
    </div>
  </div>`;
}

function pickCashAccount(code) {
  window._cashAccount = window._cashAccount === code ? null : code;
  document.querySelectorAll('.acc-card').forEach(el => el.classList.remove('active'));
  if (window._cashAccount) {
    const el = [...document.querySelectorAll('.acc-card')]
      .find(x => x.querySelector('.ac-code')?.textContent === code);
    if (el) el.classList.add('active');
    toast(`${code} дансны контекст идэвхжлээ.`);
  }
}

window.deleteStatement = async (id, file) => {
  if (!await confirmRisky({
    title: `"${file}" хуулгыг устгах уу?`,
    steps: ['Хуулгын бүх гүйлгээ устана',
            'Тэдгээрт үүссэн ангиллын санал устана',
            'Батлагдсан журналын бичилт ҮЛДЭНЭ — тэдгээрийг гараар буцаана'],
    warning: 'Энэ үйлдлийг буцаах боломжгүй. Устгахаас өмнө тайлангаа хэвлэж авахыг зөвлөе.',
    confirmLabel: 'Бүрмөсөн устгах'
  })) return;
  try {
    const r = await fetch(`/api/companies/${companyId}/statements/${id}`,
      { method: 'DELETE', headers: { Authorization: 'Bearer ' + token() } });
    const text = await r.text();
    let res = null;
    try { res = JSON.parse(text); } catch (_) {}
    if (!r.ok || !res) {
      alert(res && res.detail ? res.detail : `Устгаж чадсангүй (${r.status}). ${text.slice(0, 160)}`);
      return;
    }
    alert(`Устгалаа: ${res.file}\n${res.deleted_txns} гүйлгээ цэвэрлэгдлээ.`);
    statements();
  } catch (e) {
    alert('Холболтын алдаа: ' + e.message);
  }
};

  if (drop) drop.onclick = () => input.click();

    drop.ondragleave = () => drop.classList.remove('hover');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('hover'); upload(e.dataTransfer.files); };
  }
  if (input) input.onchange = () => upload(input.files);

  const ebDrop = $('#eb_dropzone');
  if (ebDrop) {
    ebDrop.ondragover = e => { e.preventDefault(); ebDrop.style.background = '#e0f2fe'; };

    ebDrop.ondrop = e => {
      e.preventDefault();
      ebDrop.style.background = 'var(--bg)';
      handleEbarimtFilesSelect(e.dataTransfer.files);
    };
  }
}

async function syncBankStatement() {
  const bank = $('#sync_bank').value;
  const account_no = $('#sync_acc').value.trim();
  
  if (!account_no) {
    alert("Дансны дугаарыг оруулна уу.");
    return;
  }
  
  const msgEl = $('#sync_msg');
  msgEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Банкны системтэй холбогдож байна…';
  
  try {
    const res = await post(`/companies/${companyId}/bank-accounts/sync`, {
      bank,
      account_no
    });
    
    if (res && res.ok) {
      msgEl.innerHTML = `<span style="color:var(--ok); font-weight:600;"><i class="fa-solid fa-circle-check"></i> Амжилттай! ${res.txn_count} гүйлгээ шууд татагдаж, автоматаар зөвлөмж үүслээ.</span>`;
      setTimeout(statements, 1500);
    } else {
      msgEl.innerHTML = `<span style="color:var(--danger)">Холболтонд алдаа гарлаа: ${res.detail || 'Дахин оролдоно уу'}</span>`;
    }
  } catch (err) {
    msgEl.innerHTML = `<span style="color:var(--danger)">Холболтын алдаа: ${err.message}</span>`;
  }
}

async function upload(files) {
  if (!files || files.length === 0) return;
  const fileList = files instanceof FileList ? Array.from(files) : (Array.isArray(files) ? files : [files]);
  $('#upmsg').innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Нийт ${fileList.length} банкны хуулга файлыг уншиж байна…`;
  
  let totalTxns = 0;
  let successCount = 0;
  let errMsgs = [];
  
  for (const f of fileList) {
    const fd = new FormData();
    fd.append('file', f);
    try {
      const r = await fetch(`/api/companies/${companyId}/statements`, {
        method: 'POST', body: fd, headers: { Authorization: 'Bearer ' + token() }
      });
      const text = await r.text();
      let j = null;
      try { j = JSON.parse(text); } catch (_) {}
      if (r.ok && j) {
        successCount++;
        totalTxns += (j.txn_count || 0);
      } else {
        errMsgs.push(`${f.name}: ${j && j.detail ? j.detail : (text ? text.slice(0, 120) : 'уншиж чадсангүй')}`);
      }
    } catch (err) {
      errMsgs.push(`${f.name}: ${err.message}`);
    }
  }
  
  if (successCount > 0) {
    $('#upmsg').innerHTML = `<span style="color:var(--ok); font-weight:600;"><i class="fa-solid fa-circle-check"></i> Амжилттай! ${successCount}/${fileList.length} банкны хуулга орон нийт ${totalTxns} гүйлгээ системд орсныг баталгаажууллаа.</span>`;
    setTimeout(statements, 1000);
  } else {
    $('#upmsg').innerHTML = `<span style="color:var(--danger)">Алдаа: ${errMsgs.join('; ')}</span>`;
  }
}

async function review() {
  if (!window._reviewTab) window._reviewTab = 'auto'; // 'auto' | 'manual' | 'all'

  const sugs = await api(`/companies/${companyId}/suggestions?status=pending`);
  
  const makeAccountSelect = (sugId, selectedCode) => {
    const datalistId = `datalist-${sugId}`;
    const selectedAcc = (window._accounts || []).find(a => a.code === selectedCode);
    const initialValue = selectedAcc ? `${selectedAcc.code} - ${selectedAcc.name}` : "";
    const options = (window._accounts || []).map(a => 
      `<option value="${a.code} - ${a.name}"></option>`
    ).join('');
    
    return `
      <div style="position: relative; width: 100%;">
        <input 
          type="text" 
          class="acc-select-input input-field" 
          data-sug-id="${sugId}" 
          list="${datalistId}" 
          value="${initialValue}" 
          placeholder="Хайх..."
          style="padding:6px 10px; font-size:13px; width:100%; border:1px solid var(--border-dark); border-radius:var(--radius-sm); background-color: white;"
          onfocus="this.value=''" 
          onblur="setTimeout(() => { if(!this.value){this.value='${initialValue}'} }, 200)"
        >
        <datalist id="${datalistId}">
          ${options}
        </datalist>
      </div>
    `;
  };

  const isAuto = s => s.bucket === 'auto' || (s.rationale && s.rationale.includes('Дүрэм')) || s.confidence >= 0.8;

  const autoSugs = sugs.filter(isAuto);
  const manualSugs = sugs.filter(s => !isAuto(s));

  const currentList = window._reviewTab === 'auto' ? autoSugs : window._reviewTab === 'manual' ? manualSugs : sugs;

  const rows = currentList.map(s => {
    const autoFlag = isAuto(s);
    return `<tr>
      <td style="text-align:center; padding:10px;"><input type="checkbox" class="sel" value="${s.id}" checked style="width:16px; height:16px;"></td>
      <td style="font-size:12.5px; padding:10px;">${s.date}</td>

      <td class="num" style="font-weight:700; padding:10px;">${fmt(s.amount_minor)}</td>
      <td style="font-size:12.5px; padding:10px;">${s.description}</td>
      <td style="padding:10px;">${makeAccountSelect(s.id, s.account_code)}</td>
      <td style="padding:10px;">
        <span class="pill ${autoFlag ? 'ok' : 'bad'}" style="font-weight:700; font-size:11px; padding:3px 8px;">
          ${autoFlag ? 'АВТО 100%' : 'ГАРААР 0%'}
        </span>
      </td>
      <td class="muted" style="font-size:12px; padding:10px;">${s.rationale||(autoFlag?'Автоматаар ангилагдсан':'AI идэвхгүй — гараар ангилна')}</td>
    </tr>`;
  }).join('');

  $('#content').innerHTML = `
    <div class="card" style="margin-bottom: 20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px">
        <div>
          <h2 style="margin:0;"><i class="fa-solid fa-book-open" style="color:var(--primary)"></i> Ерөнхий журнал — Гүйлгээ баталгаажуулах</h2>
          <p class="muted" style="margin-top:2px;">Нийт ${sugs.length} хүлээгдэж буй гүйлгээ (⚡ Авто таталт: ${autoSugs.length}, ✍️ Гараар ангилах: ${manualSugs.length})</p>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn secondary" onclick="selectAllReview(true)"><i class="fa-solid fa-square-check"></i> Бүгдийг сонгох</button>
          <button class="btn" onclick="approveSel()"><i class="fa-solid fa-check-double"></i> Сонгосон ${currentList.length} гүйлгээг батлах</button>
        </div>
      </div>
    </div>

    <div class="coa-tabs" style="margin-bottom:20px;">
      <button class="coa-tab ${window._reviewTab === 'auto' ? 'active' : ''}" onclick="switchReviewTab('auto')">
        <i class="fa-solid fa-bolt" style="color:#10b981"></i> ⚡ Авто таталт (Автоматаар ангилагдсан) <span class="pill ok" style="margin-left:6px; font-size:11px;">${autoSugs.length}</span>
      </button>
      <button class="coa-tab ${window._reviewTab === 'manual' ? 'active' : ''}" onclick="switchReviewTab('manual')">
        <i class="fa-solid fa-hand-pointer" style="color:#f59e0b"></i> ✍️ Гараар ангилах гүйлгээнүүд <span class="pill bad" style="margin-left:6px; font-size:11px;">${manualSugs.length}</span>
      </button>
      <button class="coa-tab ${window._reviewTab === 'all' ? 'active' : ''}" onclick="switchReviewTab('all')">
        <i class="fa-solid fa-list"></i> Бүх гүйлгээний жагсаалт <span class="pill secondary" style="margin-left:6px; font-size:11px;">${sugs.length}</span>

    <div class="card" style="padding:0; overflow:hidden;">
      <div style="overflow-x:auto">
        <table style="width:100%; border-collapse:collapse; font-size:13px;">

            <tr style="background-color: var(--border); border-bottom: 2px solid var(--border-dark)">
              <th style="width:40px; text-align:center; padding:10px;"><input type="checkbox" id="toggleAllCheck" checked onchange="selectAllReview(this.checked)" style="width:16px; height:16px;"></th>
              <th style="padding:10px; text-align:left; width:100px;">Огноо</th>
              <th style="padding:10px; text-align:left; width:90px;">Төрөл</th>
              <th class="num" style="padding:10px; text-align:right; width:130px;">Дүн (₮)</th>

            </tr>
          </thead>
          <tbody>
            ${rows || emptyRow(8, 'Баталгаажуулах гүйлгээ алга',
     'Бүх санал батлагдсан байна. Шинэ гүйлгээ орохын тулд банкны хуулга оруулна уу.',
     [{label:'Хуулга оруулах', icon:'fa-file-arrow-up', onclick:"switchTab('statements')", secondary:true}],
     'fa-circle-check')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  window.switchReviewTab = (t) => {
    window._reviewTab = t;
    review();
  };

  window.selectAllReview = (checked) => {
    document.querySelectorAll('.sel').forEach(cb => cb.checked = checked);
  };

async function approveSel() {
  const checkboxes = document.querySelectorAll('.sel:checked');
  if (!checkboxes.length) return alert('Гүйлгээ сонгоно уу.');
  
  const ids = [];
  const overrides = {};
  
  for (const cb of checkboxes) {
    const sugId = cb.value;
    ids.push(sugId);
    const selEl = document.querySelector(`.acc-select-input[data-sug-id="${sugId}"]`);
    if (selEl) {
      const val = selEl.value.split(' - ')[0].trim();
      const isValid = (window._accounts || []).some(a => a.code === val);
      if (!isValid) {
        alert(`Алдаа: "${selEl.value}" нь бүртгэлгүй данс байна. Зөвхөн жагсаалтаас сонгоно уу.`);
        return;
      }
      overrides[sugId] = val;
    }
  }
  
  const j = await post(`/companies/${companyId}/approve`, {
    suggestion_ids: ids,
    overrides: overrides
  });
  
  if (j) {
    alert(`${j.posted_entries} журналын бичилт үүслээ`);
    review();
  }
}

function switchReportMode(mode) {
  window._reportMode = mode;
  reportsTab();
}

function filterReports() {
  window._repFrom = $('#repFrom').value;
  window._repTo = $('#repTo').value;
  reportsTab();
}

function toggleReportLanguage() {
  window._reportLang = (window._reportLang === 'EN') ? 'MN' : 'EN';
  reportsTab();
}

function exportReports(format) {
  const fromDate = $('#repFrom').value;
  const toDate = $('#repTo').value;
  const year = toDate.split('-')[0];
  // Parse month correctly
  const month = parseInt(toDate.split('-')[1], 10) || 12;
  
  if (format === 'excel') {
    downloadFile(`/companies/${companyId}/reports/excel?year=${year}&month=${month}`, `bayan_reports_${year}_${month}.xlsx`);
  } else if (format === 'xml') {
    downloadFile(`/companies/${companyId}/reports/xml?year=${year}&month=${month}`, `bayan_reports_${year}_${month}.xml`);
  }
}

function exportSingleReport(type) {
  const fromDate = $('#repFrom').value;
  const toDate = $('#repTo').value;
  
  let filename = `bayan_${type}_${toDate}.xlsx`;
  if (type === 'vat') {
    filename = `bayan_vat_${toDate.split('-')[0]}.xlsx`;
  }
  
  downloadFile(`/companies/${companyId}/reports/export-single?report_type=${type}&date_from=${fromDate}&date_to=${toDate}`, filename);
}

async function uploadWipExcelModal() {
  const input = $('#wip_excel_file_input');
  if (!input || !input.files || input.files.length === 0) {
    alert("Excel файлаа сонгоно уу.");
    return;
  }
  const file = input.files[0];
  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch(`/api/companies/${companyId}/wip/orders/import-excel`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token() },
      body: formData
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      alert("Excel импортлоход алдаа гарлаа: " + (data.detail || "үл мэдэгдэх алдаа"));
      return;
    }
    alert(`Амжилттай! Нийт ${data.orders_added} ажлын захиалга нээгдлээ.`);
    hideModal();
    wipTab();
  } catch (err) {
    alert("Холболтын алдаа: " + err.message);
  }
}

async function downloadWipTemplate() {
  try {
    const res = await fetch(`/api/companies/${companyId}/wip/orders/template`, {
      headers: { Authorization: 'Bearer ' + token() }
    });
    if (!res.ok) throw new Error('Загвар файл татахад алдаа гарлаа');
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `WIP_Orders_Template.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (err) {
    alert("Алдаа: " + err.message);
  }
}

async function allocateOverheadSubmit() {
  const date_from = $('#oh_date_from').value;
  const date_to = $('#oh_date_to').value;
  const amount = parseFloat($('#oh_amount').value) || 0;
  const allocation_method = $('#oh_method').value;
  const overhead_account = $('#oh_account').value;
  
  if (amount <= 0) {
    alert("Хуваарилах зардлын дүнг зөв оруулна уу.");
    return;
  }
  
  const body = {
    date_from,
    date_to,
    amount_minor: Math.round(amount * 100),
    allocation_method,
    overhead_account
  };
  
  const res = await post(`/companies/${companyId}/wip/allocate-overhead`, body);
  if (res) {
    alert(`Нийт ${fmt(res.allocated_total_minor)} зардлыг ${res.orders_count} ажлын захиалгад амжилттай хуваарилж шингээлээ!`);
    hideModal();
    wipTab();
  }
}

  $('#modalCard').innerHTML = `

    <div style="display:flex; gap:16px; margin: 10px 0 16px 0; border-bottom:1px solid var(--border); padding-bottom:6px;">

  $('#btn_mode_dom').onclick = () => {
    isDomestic = true;
    $('#btn_mode_dom').style.color = 'var(--primary)';
    $('#btn_mode_dom').style.borderBottom = '2px solid var(--primary)';
    $('#btn_mode_imp').style.color = 'var(--text-muted)';
    $('#btn_mode_imp').style.borderBottom = 'none';
    updateModalContent();
  };
  
  $('#btn_mode_imp').onclick = () => {
    isDomestic = false;
    $('#btn_mode_imp').style.color = 'var(--primary)';
    $('#btn_mode_imp').style.borderBottom = '2px solid var(--primary)';
    $('#btn_mode_dom').style.color = 'var(--text-muted)';
    $('#btn_mode_dom').style.borderBottom = 'none';
    updateModalContent();
  };

  $('#ri_save_btn').onclick = async () => {
    const items = [];
    const exrate = isDomestic ? 1 : (parseFloat($('#ri_exrate').value) || 1);
    const moveDate = $('#ri_date').value || today();
    
    for (let i = 0; i < 3; i++) {
      const code = $(`#ri_code_${i}`).value.trim();
      const qty = parseInt($(`#ri_qty_${i}`).value, 10);
      
      let baseCostMnt = 0;
      let vatMnt = 0;
      
      if (isDomestic) {
        baseCostMnt = parseFloat($(`#ri_cost_${i}`).value) || 0;
      } else {
        const valCost = parseFloat($(`#ri_val_cost_${i}`).value) || 0;
        const duty = parseFloat($(`#ri_duty_${i}`).value) || 0;
        vatMnt = parseFloat($(`#ri_vat_${i}`).value) || 0;
        
        baseCostMnt = (valCost * exrate) + duty;
      }
      
      if (code && qty > 0 && baseCostMnt >= 0) {
        items.push({
          item_code: code,
          qty: qty,
          base_cost_minor: Math.round(baseCostMnt * 100),
          vat_minor: Math.round(vatMnt * 100)
        });
      }
    }
    
    if (items.length === 0) {
      alert("Ямар нэгэн барааны мэдээлэл оруулна уу.");
      return;
    }
    
    const addCost = parseFloat($('#ri_add_cost').value) || 0;
    const method = $('#ri_method').value;
    
    const res = await post(`/companies/${companyId}/receive-allocated`, {
      items: items,
      additional_cost_minor: Math.round(addCost * 100),
      allocation_method: method,
      move_date: moveDate
    });
    
    if (res) {
      let msg = "Орлого амжилттай хийгдлээ!\n\nХуваарилалт:";
      res.results.forEach(r => {
        msg += `\n- Код: ${r.item_code}, Тоо: ${r.qty}ш, Үндсэн өртөг (Дт 2101): ${fmt(r.final_cost_minor)}`;
      });
      const totalVat = items.reduce((sum, it) => sum + it.vat_minor, 0);
      if (totalVat > 0) {
        msg += `\n\n- НӨАТ-ын авлага (Дт 1203): ${fmt(totalVat)}`;
      }
      alert(msg);
      hideModal();
      invTab();
    }
  };
}

async function uploadInvTab(f) {
  if (!f) return;
  const btn = document.querySelector('button[onclick*="fileInvImport"]');
  const oldHtml = btn ? btn.innerHTML : 'Боловсруулж байна…';
  if (btn) {
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Боловсруулж байна…';
    btn.disabled = true;
  }
  
  try {
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch(`/api/companies/${companyId}/import/inventory?opening_date=${today()}`,
      {method:'POST', body:fd, headers:{Authorization:'Bearer '+token()}});
    const j = await r.json();
    if (r.ok) {
      alert(`Амжилттай! ${j.items_added} бараа шинээр бүртгэгдэж, ${j.balances_imported} үлдэгдэл орлогодов.`);
      hideModal();
      invTab();
    } else {
      alert(`Импортлоход алдаа гарлаа: ${j.detail || 'Буруу формат'}`);
    }
  } catch (err) {
    alert(`Холболтын алдаа: ${err.message}`);
  } finally {
    if (btn) {
      btn.innerHTML = oldHtml;
      btn.disabled = false;
    }
  }
}

function posScanItem() {
  const input = $('#pos_scan_input');
  const codeOrBarcode = input.value.trim();
  if (!codeOrBarcode) return;
  
  const stock = window._currentStock || [];
  const found = stock.find(i => i.code === codeOrBarcode || i.barcode === codeOrBarcode);
  if (found) {
    if (found.qty <= 0) {
      alert("Энэ барааны үлдэгдэл дууссан байна!");
    } else {
      posAddToCart(found.code);
    }
  } else {
    alert("Тохирох бараа олдсонгүй!");
  }
  
  input.value = '';
  input.focus();
}

function posAddToCart(code) {
  const stock = window._currentStock || [];
  const item = stock.find(i => i.code === code);
  if (!item) return;
  
  const existing = posCart.find(c => c.code === code);
  if (existing) {
    if (existing.qty < item.qty) {
      existing.qty++;
    } else {
      alert("Агуулахын үлдэгдлээс илүү гаргах боломжгүй!");
    }
  } else {
    const defRetail = item.avg_cost_minor > 0 ? Math.round(item.avg_cost_minor * 1.30) : 100000;
    posCart.push({
      code: item.code,
      name: item.name,
      qty: 1,
      max_qty: item.qty,
      retail_price_minor: defRetail
    });
  }
  posRenderCart();
}

function posRemoveFromCart(code) {
  posCart = posCart.filter(c => c.code !== code);
  posRenderCart();
}

function posUpdateQty(code, delta) {
  const existing = posCart.find(c => c.code === code);
  if (!existing) return;
  existing.qty += delta;
  if (existing.qty <= 0) {
    posRemoveFromCart(code);
  } else if (existing.qty > existing.max_qty) {
    alert("Агуулахын үлдэгдлээс илүү гарах боломжгүй!");
    existing.qty = existing.max_qty;
  }
  posRenderCart();
}

function posUpdatePrice(code, value) {
  const existing = posCart.find(c => c.code === code);
  if (!existing) return;
  existing.retail_price_minor = Math.round((parseFloat(value) || 0) * 100);
  posRenderCart(false);
}

function posTogglePaymentFields() {
  const method = $('#pos_payment_method').value;
  $('#pos_bank_field').style.display = (method === 'bank') ? 'block' : 'none';
}

function posRenderCart(fullRender = true) {
  const container = $('#pos_cart_container');
  let total = 0;
  
  posCart.forEach(c => {
    total += c.qty * c.retail_price_minor;
  });
  
  $('#pos_cart_total').textContent = fmt(total);
  
  if (!fullRender) return;
  
  if (posCart.length === 0) {
    container.innerHTML = `
      <div class="muted" style="text-align:center; padding-top:40px;">
        <i class="fa-solid fa-basket-shopping" style="font-size:32px; display:block; margin-bottom:8px; color:var(--text-muted)"></i>
        Сагс хоосон байна

async function uploadAssetsExcelModal() {
  const input = $('#assets_excel_file_input');
  if (!input || !input.files || input.files.length === 0) {
    alert("Excel файлаа сонгоно уу.");
    return;
  }
  const file = input.files[0];
  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch(`/api/companies/${companyId}/assets/import-excel`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token() },
      body: formData
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      alert("Excel импортлоход алдаа гарлаа: " + (data.detail || "үл мэдэгдэх алдаа"));
      return;
    }
    alert(`Амжилттай! Нийт ${data.assets_added} үндсэн хөрөнгө нэмэгдлээ.`);
    hideModal();
    assetsTab();
  } catch (err) {
    alert("Холболтын алдаа: " + err.message);
  }
}

async function downloadAssetsTemplate() {
  try {
    const res = await fetch(`/api/companies/${companyId}/assets/template`, {
      headers: { Authorization: 'Bearer ' + token() }
    });
    if (!res.ok) throw new Error('Загвар файл татахад алдаа гарлаа');
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Fixed_Assets_Template.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (err) {
    alert("Алдаа: " + err.message);
  }
}

function getMonthWorkDays(year, month) {
  let count = 0;
  const daysInMonth = new Date(year, month, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const dayOfWeek = new Date(year, month - 1, d).getDay();
    if (dayOfWeek !== 0 && dayOfWeek !== 6) {
      count++;
    }
  }
  return count > 0 ? count : 22;
}

function changeSalaryPeriod() {
  window._salaryYear = +$('#salYear').value;
  window._salaryMonth = +$('#salMonth').value;
  window._salaryNormDays = getMonthWorkDays(window._salaryYear, window._salaryMonth);
  salaryTab();
}

function changeSalaryNormDays(days) {
  window._salaryNormDays = days;
  if (window._salaryData) {
    window._salaryData.forEach(p => {
      p.norm_days = days;
      p.norm_hours = days * 8;
      if (!p.is_manual) {
        const wDays = p.worked_days || days;
        const dailyRate = (p.base_salary_minor || 0) / days;
        const workedPay = Math.round(dailyRate * wDays);
        p.gross_minor = workedPay + (p.allowance_minor || 0);
        recalcSalaryRow(p);
      }
    });
  }
  salaryTab();
}

function updateSalaryRow(idx, field, value) {
  if (!window._salaryData || !window._salaryData[idx]) return;
  const p = window._salaryData[idx];
  const normDays = p.norm_days || window._salaryNormDays || 22.0;

  if (field === 'work_condition') {
    p.work_condition = value;
    const condMap = { normal: 12.5, heavy: 13.5, harmful: 14.5, underground: 15.5 };
    p.ndsh_er_pct = condMap[value] || 12.5;
    if (!p.is_manual) {
      recalcSalaryRow(p);
    }
  } else if (field === 'is_manual') {
    p.is_manual = value;
    if (!value) {
      const wDays = p.worked_days || normDays;
      const dailyRate = (p.base_salary_minor || 0) / normDays;
      const workedPay = Math.round(dailyRate * wDays);
      p.gross_minor = workedPay + (p.allowance_minor || 0);
      recalcSalaryRow(p);
    }
  } else if (field === 'norm_days') {
    p.norm_days = value;
    p.norm_hours = value * 8.0;
    if (!p.is_manual) {
      const wDays = p.worked_days || value;
      const dailyRate = (p.base_salary_minor || 0) / value;
      const workedPay = Math.round(dailyRate * wDays);
      p.gross_minor = workedPay + (p.allowance_minor || 0);
      recalcSalaryRow(p);
    }
  } else if (field === 'worked_hours') {
    p.worked_hours = value;
    p.worked_days = value / 8.0;
    if (!p.is_manual) {
      const dailyRate = (p.base_salary_minor || 0) / normDays;
      const workedPay = Math.round(dailyRate * p.worked_days);
      p.gross_minor = workedPay + (p.allowance_minor || 0);
      recalcSalaryRow(p);
    }
  } else if (field === 'base_salary') {
    p.base_salary_minor = value;
    if (!p.is_manual) {
      const wDays = p.worked_days || normDays;
      const dailyRate = p.base_salary_minor / normDays;
      const workedPay = Math.round(dailyRate * wDays);
      p.gross_minor = workedPay + (p.allowance_minor || 0);
      recalcSalaryRow(p);
    }
  } else if (field === 'allowance') {
    p.allowance_minor = value;
    if (!p.is_manual) {
      const wDays = p.worked_days || normDays;
      const dailyRate = (p.base_salary_minor || 0) / normDays;
      const workedPay = Math.round(dailyRate * wDays);
      p.gross_minor = workedPay + p.allowance_minor;
      recalcSalaryRow(p);
    }
  } else if (field === 'gross') {
    p.gross_minor = value;
    if (!p.is_manual) {
      recalcSalaryRow(p);
    }
  } else if (field === 'ndsh_er') {
    p.ndsh_employer_minor = value;
  } else if (field === 'ndsh_emp') {
    p.ndsh_employee_minor = value;
  } else if (field === 'hhoat_credit') {
    p.hhoat_credit_minor = value;
    if (!p.is_manual) {
      p.hhoat_minor = Math.max((p.hhoat_gross_minor || 0) - p.hhoat_credit_minor, 0);
      p.net_minor = p.gross_minor - p.ndsh_employee_minor - p.hhoat_minor;
    }
  } else if (field === 'hhoat') {
    p.hhoat_minor = value;
  } else if (field === 'net') {
    p.net_minor = value;
  }

  salaryTab();
}

function recalcSalaryRow(p) {
  p.ndsh_employer_minor = Math.round(p.gross_minor * (p.ndsh_er_pct || 12.5) / 100);
  p.ndsh_employee_minor = Math.round(p.gross_minor * 11.5 / 100);
  const taxable = p.gross_minor - p.ndsh_employee_minor;
  p.hhoat_gross_minor = Math.round(taxable * 0.10);
  const credit = p.hhoat_credit_minor !== undefined ? p.hhoat_credit_minor : 2000000;
  p.hhoat_minor = Math.max(p.hhoat_gross_minor - credit, 0);
  p.net_minor = p.gross_minor - p.ndsh_employee_minor - p.hhoat_minor;
}

function resetSalaryRowCalculations() {
  if (!window._salaryData) return;
  window._salaryData.forEach(p => {
    p.is_manual = false;
    p.allowance_minor = 0;
    const condMap = { normal: 12.5, heavy: 13.5, harmful: 14.5, underground: 15.5 };
    p.ndsh_er_pct = condMap[p.work_condition] || 12.5;
    p.gross_minor = p.base_salary_minor || 0;
    recalcSalaryRow(p);
  });
  salaryTab();
}

async function saveAndPostPayroll(year, month) {
  if (!window._salaryData || !window._salaryData.length) return alert("Бодох ажилтан байхгүй байна.");
  
  const overrides = {};
  window._salaryData.forEach(p => {
    overrides[p.employee_id] = {
      work_condition: p.work_condition,
      is_manual: p.is_manual,
      gross: p.gross_minor,
      ndsh_er: p.ndsh_employer_minor,
      ndsh_emp: p.ndsh_employee_minor,
      hhoat: p.hhoat_minor,
      net: p.net_minor
    };
  });

  const res = await post(`/companies/${companyId}/payroll/run`, { year, month, overrides });
  if (res) {
    alert(`Амжилттай! ${year} оны ${month}-р сарын цалин бодогдож Журналд бичигдэв.`);
    salaryTab();
  }
}

async function savePartner(partnerId) {
  const name = $('#cp_name').value.trim();
  const reg_no = $('#cp_reg').value.trim() || "";
  const credit_limit = parseFloat($('#cp_limit').value) || 0;
  
  if (!name) {
    alert("Харилцагчийн нэрийг заавал оруулна уу.");
    return;
  }
  
  const body = {
    name,
    reg_no,
    credit_limit_minor: Math.round(credit_limit * 100)
  };
  
  const path = partnerId 
    ? `/companies/${companyId}/counterparties/${partnerId}` 
    : `/companies/${companyId}/counterparties`;
    
  const res = await post(path, body);
  if (res) {
    alert(partnerId ? "Харилцагчийн мэдээлэл шинэчлэгдлээ." : "Шинэ харилцагч бүртгэгдлээ.");
    hideModal();
    partnersTab();
  }
}

function wipAct(action) {

    fields.push({k:'item_code', label:'Материалын код'},

    fields.push({k:'amt', label:'Дүн (₮)', type:'number'});

    <h2><i class="fa-solid fa-calculator" style="color:var(--primary)"></i> Бараа тооллого ба Тулгалт</h2>
    <p class="muted" style="margin-bottom:16px;">Бодит тооллогын үлдэгдлийг оруулахад систем зөрүүг автоматаар тооцож, өртгийн залруулгын журналын бичилтийг үүсгэнэ.</p>
    
    <div class="grid-2" style="margin-bottom:16px;">
      <div class="form-group">
        <label>Тооллогын огноо</label>
        <input id="st_date" type="date" class="input-field" value="${today()}" style="height:38px;">
      </div>
      <div class="form-group">
        <label>Тайлбар / Баримт №</label>
        <input id="st_ref" class="input-field" value="Тооллогын зөрүү тохируулав" style="height:38px;">
      </div>
    </div>
    
    <div style="max-height:350px; overflow-y:auto; border:1px solid var(--border); border-radius:6px; margin-bottom:20px;">
      <table class="grid-table" style="width:100%; border-collapse:collapse; font-size:13.5px;">
        <thead style="position:sticky; top:0; background:var(--bg-card); z-index:1;">
          <tr style="border-bottom:1px solid var(--border); background-color:var(--border);">
            <th style="text-align:left; padding:8px;">Код</th>
            <th style="text-align:left; padding:8px;">Нэр</th>
            <th class="num" style="padding:8px; width:110px;">Системд</th>
            <th class="num" style="padding:8px; width:130px; text-align:center;">Бодит тоо</th>
            <th class="num" style="padding:8px; width:100px;">Зөрүү</th>
          </tr>
        </thead>
        <tbody>
          ${stock.map((i, index) => `
            <tr style="border-bottom:1px solid var(--border);" data-item-id="${i.id}">
              <td style="padding:8px;">${i.code}</td>
              <td style="padding:8px;">${i.name}</td>
              <td class="num" style="padding:8px; font-weight:bold;" id="st_book_${index}">${i.qty}</td>
              <td style="padding:4px; text-align:center;">
                <input type="number" id="st_act_${index}" class="input-field" value="${i.qty}" 
                       style="width:100px; height:28px; text-align:right; padding:0 6px; font-size:13px;"
                       oninput="calcStocktakeVariance(${index})">
              </td>
              <td class="num" id="st_diff_${index}" style="padding:8px; font-weight:bold; color:var(--text-muted);">0</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn secondary" onclick="hideModal()">Болих</button>
      <button class="btn" id="st_save_btn">Тооллого хадгалах</button>
    </div>
  `;
  
  $('#modalCard').innerHTML = html;
  $('#modalOverlay').style.display = 'flex';
  
  $('#st_save_btn').onclick = async () => {
    const move_date = $('#st_date').value;
    const ref = $('#st_ref').value.trim() || 'Тооллогын зөрүү';
    
    // Collect all variances
    const adjustments = [];
    for (let idx = 0; idx < stock.length; idx++) {
      const item = stock[idx];
      const actVal = parseInt($(`#st_act_${idx}`).value, 10);
      if (isNaN(actVal)) continue;
      
      const diff = actVal - item.qty;
      if (diff !== 0) {
        adjustments.push({
          item_id: item.id,
          actual_qty: actVal
        });
      }
    }
    
    if (adjustments.length === 0) {
      alert("Ямар нэгэн зөрүүтэй бараа байхгүй байна.");
      return;
    }
    
    let btn = $('#st_save_btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Хадгалж байна…';
    
    let successCount = 0;
    try {
      for (const adj of adjustments) {
        const res = await post(`/companies/${companyId}/inventory/stocktake`, {
          item_id: adj.item_id,
          actual_qty: adj.actual_qty,
          move_date,
          ref
        });
        if (res && res.ok) {
          successCount++;
        }
      }
      alert(`Амжилттай! Нийт ${successCount} барааны тооллогын зөрүүний журналын гүйлгээ үүслээ.`);
      hideModal();
      invTab();
    } catch (err) {
      alert(`Алдаа гарлаа: ${err.message}`);
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Тооллого хадгалах';
    }
  };
}

function calcStocktakeVariance(index) {
  const book = parseInt($(`#st_book_${index}`).innerText, 10) || 0;
  const act = parseInt($(`#st_act_${index}`).value, 10);
  const diffEl = $(`#st_diff_${index}`);
  
  if (isNaN(act)) {
    diffEl.innerText = '-';
    diffEl.style.color = 'var(--text-muted)';
    return;
  }
  
  const diff = act - book;
  if (diff > 0) {
    diffEl.innerText = `+${diff}`;
    diffEl.style.color = 'var(--ok)';
  } else if (diff < 0) {
    diffEl.innerText = `${diff}`;
    diffEl.style.color = 'var(--danger)';
  } else {
    diffEl.innerText = '0';
    diffEl.style.color = 'var(--text-muted)';
  }
}

function switchTransferTab(tab) {

    $('#btn_tab_receive').style.borderBottom = 'none';
    $('#btn_tab_receive').style.color = 'var(--text-muted)';
  } else {
    $('#transfer_tab_ship').style.display = 'none';

    $('#btn_tab_receive').style.borderBottom = '2px solid var(--primary)';

    $('#btn_tab_ship').style.borderBottom = 'none';

  }
}

async function postPeriodLock() {
  const year = parseInt($('#lock_year').value, 10);
  const month = parseInt($('#lock_month').value, 10);
  
  const res = await post(`/companies/${companyId}/period-lock`, {
    year,
    month
  });
  
  if (res) {
    alert(`${year} оны ${month}-р сарыг амжилттай түгжлээ.`);
    renderPeriodLockTab();
  }
}

async function postPeriodUnlock(year, month) {
  if (!confirm(`${year} оны ${month}-р сарын санхүүгийн түгжээг тайлах уу?`)) {
    return;
  }
  
  const res = await post(`/companies/${companyId}/period-unlock`, {
    year,
    month
  });
  
  if (res) {
    alert(`${year} оны ${month}-р сарын түгжээг тайллаа.`);
    renderPeriodLockTab();
  }
}

async function uploadTimesheetExcelModal(year, month) {
  const input = $('#ts_excel_file_input');
  if (!input || !input.files || input.files.length === 0) {
    alert("Excel файлаа сонгоно уу.");
    return;
  }
  const file = input.files[0];
  const formData = new FormData();
  formData.append('year', year);
  formData.append('month', month);
  formData.append('file', file);

  try {
    const res = await fetch(`/api/companies/${companyId}/timesheets/import-excel`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token() },
      body: formData
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      alert("Excel импортлоход алдаа гарлаа: " + (data.detail || (data.errors && data.errors.join("\n")) || "үл мэдэгдэх алдаа"));
      return;
    }
    let msg = `Амжилттай! Нийт ${data.imported_count} ажилтны цагийн бүртгэл хадгалагдлаа.`;
    if (data.errors && data.errors.length > 0) {
      msg += "\n\nСанамж:\n" + data.errors.join("\n");
    }
    alert(msg);
    openTimesheetModal();
  } catch (err) {
    alert("Холболтын алдаа: " + err.message);
  }
}

async function downloadTimesheetTemplate(year, month) {
  try {
    const res = await fetch(`/api/companies/${companyId}/timesheets/template?year=${year}&month=${month}`, {
      headers: { Authorization: 'Bearer ' + token() }
    });
    if (!res.ok) throw new Error('Загвар файл татахад алдаа гарлаа');
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Timesheet_Template_${year}_${month}.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (err) {
    alert("Алдаа: " + err.message);
  }
}

function calcTsRowTotal(idx) {
  const w = parseFloat($(`#ts_work_${idx}`).value) || 0;
  const ot = parseFloat($(`#ts_ot_${idx}`).value) || 0;
  const hol = parseFloat($(`#ts_hol_${idx}`).value) || 0;
  const total = (w * 8) + (ot * 1.5) + (hol * 2.0);
  const el = $(`#ts_total_hrs_${idx}`);
  if (el) el.innerText = total.toFixed(1) + ' цаг';
}

async function saveTimesheetsList(count, year, month) {
  const promises = [];
  for (let i = 0; i < count; i++) {
    const employee_id = $(`#ts_emp_${i}`).value;
    const worked_days = parseFloat($(`#ts_work_${i}`).value) || 0;
    const vacation_days = parseFloat($(`#ts_vac_${i}`).value) || 0;
    const sick_days = parseFloat($(`#ts_sick_${i}`).value) || 0;
    const unpaid_leave_days = parseFloat($(`#ts_unpaid_${i}`).value) || 0;
    const overtime_hours = parseFloat($(`#ts_ot_${i}`).value) || 0;
    const holiday_hours = parseFloat($(`#ts_hol_${i}`).value) || 0;
    
    promises.push(
      post(`/companies/${companyId}/timesheets`, {
        employee_id,
        year,
        month,
        worked_days,
        vacation_days,
        sick_days,
        unpaid_leave_days,
        overtime_hours,
        holiday_hours
      })
    );
  }
  
  const results = await Promise.all(promises);
  if (results) {
    alert("Цагийн бүртгэлийн хүснэгт амжилттай хадгалагдлаа.");
    hideModal();
    salaryTab();
  }
}

async function viewEmployeePayslip(employeeId, year, month) {
  $('#modalCard').style.width = '550px';
  
  const [emps, tsList, payroll] = await Promise.all([
    api(`/companies/${companyId}/employees`),
    api(`/companies/${companyId}/timesheets?year=${year}&month=${month}`).catch(() => []),
    api(`/companies/${companyId}/payroll?year=${year}&month=${month}`).catch(() => [])
  ]);
  
  const emp = emps.find(e => e.id === employeeId);
  const ts = tsList.find(t => t.employee_id === employeeId) || { worked_days: 22, vacation_days: 0, sick_days: 0, sick_pay_pct: 60 };
  const pay = payroll.find(p => p.employee_id === employeeId);
  
  if (!emp || !pay) {
    alert("Цалингийн мэдээлэл олдсонгүй.");
    return;
  }
  
  // Calculate daily base rate
  const baseDaily = emp.base_salary_minor / 22;
  const workedPay = baseDaily * ts.worked_days;
  
  // Let's explain vacation rate (based on 12-month average as computed on backend)
  // gross = workedPay + vacationPay + sickPay
  // paid vacation_days * vacation_rate = vacation_pay
  // We can calculate the implicit vacation pay & vacation rate:
  // Vacation rate is computed as average gross of last 12 months / 22
  const grossValue = pay.gross_minor;
  const sickPay = baseDaily * ts.sick_days * (ts.sick_pay_pct / 100);
  const vacationPay = Math.max(grossValue - workedPay - sickPay, 0);
  const vacationDailyRate = ts.vacation_days > 0 ? (vacationPay / ts.vacation_days) : 0;
  
  let html = `
    <h2><i class="fa-solid fa-file-invoice" style="color:var(--primary)"></i> Цалингийн бодолтын хуудас (Payslip)</h2>
    <p class="muted" style="margin-bottom:16px;">${year} оны ${month}-р сар</p>
    
    <div style="background-color:rgba(0, 180, 120, 0.05); padding:12px; border-radius:6px; margin-bottom:16px; font-size:13.5px;">
      <p style="margin:2px 0;">Ажилтан: <b>${emp.code} - ${emp.last_name} ${emp.first_name}</b></p>
      <p style="margin:2px 0;">Албан тушаал: <b>${emp.position || 'Бүртгэлгүй'}</b></p>
      <p style="margin:2px 0;">Үндсэн цалин: <b>${fmt(emp.base_salary_minor)}</b></p>
    </div>
    
    <h3 style="font-size:14px; font-weight:700; margin-bottom:8px;"><i class="fa-solid fa-list"></i> Нэмэгдэл ба Олголт</h3>
    <div style="border:1px solid var(--border); border-radius:6px; padding:10px; font-size:13px; margin-bottom:16px; background-color:var(--bg-card);">
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span>Ажилласан хоногийн олголт (${ts.worked_days} өдөр):</span>
        <span style="font-weight:600;">${fmt(workedPay)}</span>
      </div>
      
      ${ts.vacation_days > 0 ? `
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
          <span>Ээлжийн амралт (${ts.vacation_days} өдөр):</span>
          <span style="font-weight:600;">${fmt(vacationPay)}</span>
        </div>
        <p class="muted" style="font-size:11.5px; margin: 0 0 8px 12px; color:var(--primary);">
          ℹ️ Өнгөрсөн 12 сарын бохир цалингийн дунджаас бодогдсон хоногийн үнэлгээ: <b>${fmt(vacationDailyRate)}</b>
        </p>
      ` : ''}
      
      ${ts.sick_days > 0 ? `
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
          <span>Өвчтэй байсан хоногийн олголт (${ts.sick_days} өдөр, ${ts.sick_pay_pct}%):</span>
          <span style="font-weight:600;">${fmt(sickPay)}</span>
        </div>
      ` : ''}
      
      <div style="display:flex; justify-content:space-between; border-top:1px solid var(--border); padding-top:6px; font-weight:700;">
        <span>Нийт бохир цалин (Gross):</span>
        <span>${fmt(pay.gross_minor)}</span>
      </div>
    </div>
    
    <h3 style="font-size:14px; font-weight:700; margin-bottom:8px;"><i class="fa-solid fa-minus"></i> Суутгал</h3>
    <div style="border:1px solid var(--border); border-radius:6px; padding:10px; font-size:13px; margin-bottom:20px; background-color:var(--bg-card);">
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span>Нийгмийн даатгалын шимтгэл (НДШ):</span>
        <span style="font-weight:600; color:var(--danger);">${fmt(pay.ndsh_employee_minor)}</span>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span>Хувь хүний орлогын албан татвар (ХХОАТ):</span>
        <span style="font-weight:600; color:var(--danger);">${fmt(pay.hhoat_minor)}</span>
      </div>
      
      <div style="display:flex; justify-content:space-between; border-top:1px solid var(--border); padding-top:6px; font-weight:700;">
        <span>Гарт олгох цэвэр цалин (Net):</span>
        <span style="color:var(--primary); font-size:15px;">${fmt(pay.net_minor)}</span>
      </div>
    </div>
    
    <div style="display:flex; justify-content:flex-end;">
      <button class="btn secondary" onclick="hideModal()">Хаах</button>
    </div>
  `;

function addKitRow() {
  const options = window._kitItemOptions || '';

  div.style.cssText = 'margin-bottom:8px; align-items:center;';
  div.innerHTML = `
    <select class="input-field kit-child" style="height:36px;">
      <option value="">-- Бүрэлдэхүүн бараа сонгох --</option>
      ${options}

      <button class="btn secondary" style="color:var(--danger); padding:0 10px;" onclick="this.closest('.kit-row').remove()"><i class="fa-solid fa-trash"></i></button>
    </div>
  `;
  $('#kitRowsContainer').appendChild(div);

async function saveItemKitComponents(itemId) {
  const rows = document.querySelectorAll('.kit-row');
  const components = [];
  rows.forEach(r => {
    const child_item_id = r.querySelector('.kit-child').value;
    const quantity = parseFloat(r.querySelector('.kit-qty').value) || 1.0;
    if (child_item_id) {
      components.push({ child_item_id, quantity });
    }
  });
  
  const res = await post(`/companies/${companyId}/items/${itemId}/components`, { components });
  if (res) {
    alert("Барааны багц / Сет тохиргоо амжилттай хадгаллаа!");
    hideModal();
    invTab();
  }
}

// eBarimt-ын 4 тайлан — файлын нэрээр төрлийг таана (сервер талын
// detect_dataset-тэй ижил дүрэм), хэрэглэгч гараар засаж болно.
const EB_DATASETS = [
  ['org_income', 'Байгууллагын орлого'],
  ['org_expense', 'Байгууллагын зарлага'],
  ['citizen_income', 'Иргэний орлого'],
  ['citizen_expense', 'Иргэний зарлага'],
];

function guessEbarimtDataset(name) {
  const t = (name || '').toLowerCase().replace(/[_-]/g, ' ');
  let kind = null, flow = null;
  if (/байгууллаг|аан|b2b|org|company/.test(t)) kind = 'org';
  else if (/иргэн|хувь хүн|b2c|citizen/.test(t)) kind = 'citizen';
  if (/зарлага|худалдан|авалт|purchase|expense/.test(t)) flow = 'expense';
  else if (/орлого|борлуулалт|sale|income/.test(t)) flow = 'income';
  if (!kind || !flow) return '';
  return `${kind}_${flow}`;
}

function handleEbarimtFilesSelect(files) {
  if (!files || files.length === 0) return;
  const newFiles = Array.from(files).map(f => ({ file: f, dataset: guessEbarimtDataset(f.name) }));
  window._selectedEbarimtFiles = [...window._selectedEbarimtFiles, ...newFiles];
  renderEbarimtFileList();
}

function removeEbarimtFile(idx) {
  window._selectedEbarimtFiles.splice(idx, 1);
  renderEbarimtFileList();
}

function setEbarimtFileDataset(idx, value) {
  if (window._selectedEbarimtFiles[idx]) window._selectedEbarimtFiles[idx].dataset = value;
}

function renderEbarimtFileList() {
  const listEl = $('#eb_file_list');
  if (!listEl) return;
  if (window._selectedEbarimtFiles.length === 0) {
    listEl.innerHTML = '';
    return;
  }
  listEl.innerHTML = window._selectedEbarimtFiles.map((entry, i) => {
    const f = entry.file;
    const opts = ['<option value="">Төрлийг автоматаар таних</option>']
      .concat(EB_DATASETS.map(([k, label]) =>
        `<option value="${k}" ${entry.dataset === k ? 'selected' : ''}>${label}</option>`))
      .join('');
    return `
    <div style="background:var(--bg); padding:4px 6px; border-radius:4px; margin-bottom:3px; font-size:11px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">

        <span style="cursor:pointer; color:var(--danger); font-weight:700; margin-left:6px;" onclick="removeEbarimtFile(${i})">×</span>
      </div>
      <select class="input-field" style="height:28px; font-size:11px; padding:2px 6px; margin-top:3px; width:100%;"
              onchange="setEbarimtFileDataset(${i}, this.value)">${opts}</select>
    </div>`;
  }).join('');
}

async function runEbarimtBankReconciliation() {
  const mode = $('#eb_mode').value;
  const formData = new FormData();
  formData.append('mode', mode);
  
  if (mode === 'excel') {
    let entries = window._selectedEbarimtFiles;
    if (entries.length === 0 && $('#eb_excel_file') && $('#eb_excel_file').files) {
      entries = Array.from($('#eb_excel_file').files)
        .map(f => ({ file: f, dataset: guessEbarimtDataset(f.name) }));
    }
    if (entries.length === 0) {
      alert("eBarimt-ын тайлан файлуудаа сонгоно уу!");
      return;
    }
    // files ба datasets нь ижил дараалалтай — сервер тэр дарааллаар хослуулна
    for (const e of entries) {
      formData.append('files', e.file);
      formData.append('datasets', e.dataset || '');
    }
    const daily = $('#eb_daily');
    formData.append('daily_aggregate', daily ? String(daily.checked) : 'true');
  } else {
    const ym = $('#eb_month').value || '2026-07';
    const parts = ym.split('-');
    formData.append('year', parts[0]);
    formData.append('month', parseInt(parts[1], 10));
  }

  $('#eb_sync_msg').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> eBarimt тулгалт хийж байна...';
  try {
    const r = await fetch(`/api/companies/${companyId}/ebarimt/reconcile-bank`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token() },
      body: formData
    });
    // Серверийн дотоод алдаа JSON биш (HTML/текст) буцаадаг тул шууд задалж
    // болохгүй — эс тэгвэл "is not valid JSON" гэсэн ойлгомжгүй алдаа гарна
    const text = await r.text();
    let res = null;
    try { res = JSON.parse(text); } catch (_) {}
    $('#eb_sync_msg').innerText = "";
    if (!r.ok || !res) {
      alert(res && res.detail
        ? res.detail
        : `Серверийн алдаа (${r.status}). Дэлгэрэнгүй: ${text.slice(0, 200) || 'хариу хоосон'}`);
      return;
    }
    openEbarimtBankReconModal(res);
  } catch (err) {
    $('#eb_sync_msg').innerText = "";
    alert("Холболтын алдаа: " + err.message);
  }
}

function filterEbarimtByDataset(ds) {
  window._ebDatasetFilter = (window._ebDatasetFilter === ds) ? null : ds;

// --- eBarimt баримтуудыг нэхэмжлэх + журнал болгон буулгах -------------------
// Хоёр алхамт: эхлээд dry_run=true-гээр төлөвлөгөө харуулна, дараа нь батална.
// Ингэснээр давхар бүртгэл үүсэх эрсдэлийг хэрэглэгч нүдээрээ шалгана.

function _ebarimtDocsForm(extra) {
  const fd = new FormData();
  fd.append('mode', 'excel');
  for (const e of (window._selectedEbarimtFiles || [])) {
    fd.append('files', e.file);
    fd.append('datasets', e.dataset || '');
  }
  Object.entries(extra || {}).forEach(([k, v]) => fd.append(k, String(v)));
  return fd;
}

async function _ebarimtDocsCall(extra) {
  const r = await fetch(`/api/companies/${companyId}/ebarimt/post-documents`, {
    method: 'POST', headers: { Authorization: 'Bearer ' + token() },
    body: _ebarimtDocsForm(extra)
  });
  const text = await r.text();
  let j = null;
  try { j = JSON.parse(text); } catch (_) {}
  return { ok: r.ok, status: r.status, data: j, raw: text };
}

async function previewEbarimtDocuments() {
  if (!window._selectedEbarimtFiles || !window._selectedEbarimtFiles.length) {
    alert('Файлууд сонгогдоогүй байна. eBarimt тайлангаа дахин сонгож тулгана уу.');
    return;
  }
  const res = await _ebarimtDocsCall({ dry_run: true });
  if (!res.ok || !res.data) {
    alert((res.data && res.data.detail) || `Серверийн алдаа (${res.status})`);
    return;
  }
  openEbarimtDocsModal(res.data);
}

async function _ebarimtSettleCall(extra) {
  const r = await fetch(`/api/companies/${companyId}/ebarimt/settle-bank`, {
    method: 'POST', headers: { Authorization: 'Bearer ' + token() },
    body: _ebarimtDocsForm(extra)
  });
  const text = await r.text();
  let j = null;
  try { j = JSON.parse(text); } catch (_) {}
  return { ok: r.ok, status: r.status, data: j };
}

async function submitLandedCostAllocation() {
  const shipment_name = $('#lc_shipment').value.trim();
  const additional_cost_minor = Math.round((parseFloat($('#lc_cost').value) || 0) * 100);
  const allocation_basis = $('#lc_basis').value;
  
  if (!shipment_name || additional_cost_minor <= 0) {
    alert("Ачааны нэр болон нэмэгдэл зардлыг оруулна уу.");
    return;
  }
  
  const items = [];
  document.querySelectorAll('.lc-item-row').forEach(row => {
    const sel = row.querySelector('.lc-select').checked;
    if (sel) {
      const item_id = row.getAttribute('data-id');
      const qty = parseInt(row.querySelector('.lc-qty').value) || 1;
      const price_minor = Math.round((parseFloat(row.querySelector('.lc-price').value) || 0) * 100);
      items.push({ item_id, qty, price_minor });
    }
  });
  
  if (items.length === 0) {
    alert("Хуваарилах барааг сонгоно уу.");
    return;
  }
  
  const res = await post(`/companies/${companyId}/landed-costs/allocate`, {
    shipment_name, additional_cost_minor, allocation_basis, items
  });
  
  if (res) {
    alert(`Гаалийн татан авалтын нэмэгдэл ${fmt(additional_cost_minor)} амжилттай хуваарилагдаж, Журналд бүртгэгдлээ!`);
    hideModal();
    invTab();
  }
}
