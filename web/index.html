async function submitCompanyBudgets() {
  const year = parseInt($('#bg_year').value) || new Date().getFullYear();
  const month = parseInt($('#bg_month').value) || 1;
  const items = [];
  
  document.querySelectorAll('.budget-row').forEach(r => {
    const account_code = r.getAttribute('data-code');
    const val = parseFloat(r.querySelector('.budget-amt').value) || 0;
    if (val > 0) {
      items.push({ account_code, budget_minor: Math.round(val * 100) });
    }
  });
  
  if (items.length === 0) {
    alert("Ядаж нэг дансанд төсвийн дүн оруулна уу.");
    return;
  }
  
  const res = await post(`/companies/${companyId}/budgets`, { year, month, items });
  if (res) {
    alert(`Нийт ${res.count} дансны төсөв амжилттай хадгалагдлаа!`);
    hideModal();
    reportsTab();
  }
}

async function saveUserPermissionMatrix(userId) {
  const permissions = {};
  document.querySelectorAll('.perm-row').forEach(r => {
    const modKey = r.getAttribute('data-mod');
    permissions[modKey] = {
      read: r.querySelector('.p-read').checked,
      create: r.querySelector('.p-create').checked,
      edit: r.querySelector('.p-edit').checked,
      delete: r.querySelector('.p-delete').checked
    };
  });
  
  const res = await post(`/companies/${companyId}/users/${userId}/permissions`, { permissions });
  if (res) {
    alert(res.msg);
    hideModal();
  }
}

async function copyPermissionsToUser(srcUserId) {

  const res = await post(`/companies/${companyId}/users/${srcUserId}/copy-permissions-to/${targetId}`, {});

async function uploadEmployeeExcel() {
  const fileInput = $('#emp_excel_file');
  if (!fileInput.files[0]) { alert("Excel файлуудаас нэгийг сонгоно уу."); return; }
  
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  
  const tokenVal = token();
  const res = await fetch(`/api/companies/${companyId}/import/employees`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${tokenVal}` },
    body: formData
  }).then(r => r.json());
  
  if (res && res.ok) {
    alert(res.msg);
    hideModal();
    salaryTab();
  } else {
    alert(res.detail || "Импортлоход алдаа гарлаа.");
  }
}

      </div>

        style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">

               onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();assistantSend();}">

                style="padding:8px 12px;"><i class="fa-solid fa-paper-plane"></i></button>

  document.addEventListener('keydown', (e) => {

async function loadAssistantCatalog() {
  asstCatalog = await api(`/companies/${companyId}/assistant/catalog`).catch(() => []);
  renderAssistantChips();
}

async function refreshAssistantBadge() {
  const res = await api(`/companies/${companyId}/anomalies`).catch(() => null);
  const high = res && res.by_severity ? res.by_severity.high : 0;
  const fab = $('#asstFab');
  if (!fab) return;
  const old = fab.querySelector('#asstBadge');
  if (old) old.remove();
  if (high > 0) {
    const b = document.createElement('span');
    b.id = 'asstBadge';
    b.textContent = high > 9 ? '9+' : String(high);
    b.title = `${high} ноцтой гажилт`;
    fab.appendChild(b);
  }
}

function toggleAssistant() {
  const panel = $('#asstPanel');
  if (!panel) return;
  asstOpen = !asstOpen;
  panel.classList.toggle('open', asstOpen);
  if (asstOpen) setTimeout(() => $('#asstInput') && $('#asstInput').focus(), 60);
}

function asstGreet() {
  asstTurns = [{
    role: 'bot', status: 'answered',
    text: 'Сайн байна уу. Дэвтэрт байгаа тоог асуугаарай — борлуулалт, '
        + 'зардал, мөнгө, авлага, таамаг, гажилт. Мэдэхгүй зүйлээ '
        + 'таамаглахгүй, шууд хэлнэ.'
  }];
  renderAssistantTurns();
}

function renderAssistantChips() {
  const box = $('#asstChips');
  if (!box) return;
  // Яриа эхэлсэн бол саналыг нуухгүй, гэхдээ цөөхөн үлдээнэ
  const picks = asstCatalog.slice(0, asstTurns.length > 1 ? 4 : 6);
  box.innerHTML = picks.map(m =>
    `<button class="asst-chip" onclick="assistantSend('${esc(m.example)} хэд вэ')">${esc(m.title)}</button>`
  ).join('');
}

function renderAssistantTurns() {
  const body = $('#asstBody');
  if (!body) return;
  body.innerHTML = asstTurns.map(t => t.role === 'user'
    ? `<div class="asst-msg asst-user">${esc(t.text)}</div>`
    : `<div class="asst-msg asst-bot ${t.status === 'denied' ? 'denied' : ''}
         ${['unknown','unavailable'].includes(t.status) ? 'muted-turn' : ''}">
         ${esc(t.text)}${assistantDetailHtml(t.data)}</div>`
  ).join('');
  body.scrollTop = body.scrollHeight;
  renderAssistantChips();
}

function assistantDetailHtml(d) {
  if (!d) return '';
  const val = d.unit === 'count' ? d.value_minor : fmt(d.value_minor);
  let html = `<div class="asst-detail">
    <table><tr>
      <td><b>${esc(d.title)}</b><br><span style="opacity:.7">${esc(d.period)}</span></td>
      <td class="num" style="font-weight:700; font-size:13px;">${val}</td>
    </tr></table>`;

  const cmp = d.compare || {};
  if (cmp.mape_pct !== undefined && cmp.mape_pct !== null) {
    html += `<div style="margin-top:5px">Хүрээ: ${cmp.low_minor != null
      ? fmt(cmp.low_minor) + ' – ' + fmt(cmp.high_minor) : '—'}
      · алдаа ${cmp.mape_pct}% (${cmp.backtest_points} үе)</div>`;
  }

  if (d.rows && d.rows.length) {
    html += `<div style="max-height:150px; overflow:auto; margin-top:6px;">
      <table>${d.rows.slice(0, 12).map(r => `<tr>
        <td>${esc(r.code || '')} ${esc(r.name || '')}</td>
        <td class="num">${d.unit === 'count' ? '' : fmt(r.amount_minor || 0)}</td>
      </tr>`).join('')}</table></div>`;
  }
  if (d.masked_rows) {
    html += `<div style="margin-top:4px; opacity:.75">Эрхийн улмаас ${d.masked_rows} мөр нуугдсан.</div>`;
  }
  html += `<div class="asst-src">${esc(d.source || '')}${
    d.accounts && d.accounts.length ? ' · Данс: ' + d.accounts.map(esc).join(', ') : ''}</div>`;
  return html + '</div>';
}

async function assistantSend(preset) {
  if (asstBusy) return;
  const input = $('#asstInput');
  const question = (preset || (input ? input.value : '')).trim();
  if (!question) return;
  if (input) input.value = '';

  asstTurns.push({ role: 'user', text: question });
  asstTurns.push({ role: 'bot', status: 'pending', text: 'Дэвтрээс тоог гаргаж байна…' });
  renderAssistantTurns();

  asstBusy = true;
  $('#asstSend').disabled = true;
  try {
    const out = await post(`/companies/${companyId}/assistant/ask`, { question });
    asstTurns.pop();
    if (out) {
      asstTurns.push({ role: 'bot', text: out.answer, data: out.data, status: out.status });
    } else {
      asstTurns.push({ role: 'bot', status: 'unknown', text: 'Хариу авч чадсангүй.' });
    }
  } catch (e) {
    asstTurns.pop();
    asstTurns.push({ role: 'bot', status: 'unknown', text: e.message });
  } finally {
    asstBusy = false;
    const btn = $('#asstSend');
    if (btn) btn.disabled = false;
    renderAssistantTurns();
  }
}

async function tt11Send(apply) {
  const file = $('#tt11_file').files[0];
  if (!file) { alert('ТТ-11 файлаа сонгоно уу.'); return null; }

  const fd = new FormData();
  fd.append('file', file);
  fd.append('year', $('#tt11_year').value);
  fd.append('month', $('#tt11_month').value);
  fd.append('apply', apply ? 'true' : 'false');
  fd.append('post_entry', $('#tt11_post_entry').checked ? 'true' : 'false');

  const r = await fetch(`/api/companies/${companyId}/payroll/import-tt11`,
    { method: 'POST', body: fd, headers: { Authorization: 'Bearer ' + token() } });
  const text = await r.text();
  let res = null;
  try { res = JSON.parse(text); } catch (_) {}
  if (!r.ok || !res) throw new Error(
    res && res.detail ? res.detail : `Серверийн алдаа (${r.status}). ${text.slice(0, 160)}`);
  return res;
}

async function tt11Preview() {

    const rows = p.preview.map(x => `<tr>

    </tr>`).join('');

    const t = p.totals;
    const notes = [];
    if (p.skipped_count) notes.push(
      `<div class="muted" style="font-size:12px; margin-top:8px">
         Алгасах ${p.skipped_count} мөр: ${p.skipped.slice(0, 4).join('; ')}</div>`);
    if (p.warnings_count) notes.push(
      `<div style="font-size:12px; margin-top:8px; color:var(--warning, #d08700)">
         <b>${p.warnings_count} мөрийн тэнцэл зөрж байна:</b><br>

    $('#tt11_preview').innerHTML = `
      <div style="max-height:260px; overflow:auto; border:1px solid var(--border, #2a2a3a); border-radius:8px;">
        <table class="grid-table" style="font-size:12.5px; margin:0;">

            <th class="num">НДШ</th><th class="num">ХХОАТ</th><th class="num">Гарт</th>

          <tfoot><tr style="font-weight:700">

            <td class="num">${fmt(t.gross_minor)}</td>

    drawer.style.cssText = 'position:fixed; bottom:80px; right:20px; width:360px; height:480px; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.15); z-index:9999; display:flex; flex-direction:column; overflow:hidden;';
    drawer.innerHTML = `
      <div style="background:linear-gradient(135deg, #2563eb, #7c3aed); color:#fff; padding:12px 16px; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
        <span><i class="fa-solid fa-robot"></i> Bayan AI Санхүүгийн Туслах</span>
        <button style="background:none; border:none; color:#fff; cursor:pointer; font-size:16px;" onclick="$('#aiChatDrawer').style.display='none'">✕</button>
      </div>
      <div id="aiChatMessages" style="flex:1; padding:12px; overflow-y:auto; font-size:13px; display:flex; flex-direction:column; gap:8px;">
        <div style="background:#f1f5f9; padding:8px 12px; border-radius:8px; align-self:flex-start; max-width:85%;">
          Сайн байна уу? Би Bayan AI туслах байна. Санхүү, борлуулалт, касс болон агуулахтай холбоотой асуултаа асууна уу.
        </div>
      </div>
      <div style="padding:10px; border-top:1px solid var(--border); display:flex; gap:6px;">
        <input id="aiChatInput" class="input-field" placeholder="Асуултаа бичнэ үү..." style="flex:1; height:34px; font-size:12px;" onkeypress="if(event.key==='Enter') sendAiChatMessage()">
        <button class="btn btn-xs" style="height:34px; background:#2563eb;" onclick="sendAiChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    `;
    document.body.appendChild(drawer);
  } else {
    drawer.style.display = drawer.style.display === 'none' ? 'flex' : 'none';
  }
}

async function sendAiChatMessage() {
  const input = $('#aiChatInput');
  const query = input.value.trim();
  if (!query) return;
  
  const msgDiv = $('#aiChatMessages');
  msgDiv.innerHTML += `<div style="background:#2563eb; color:#fff; padding:8px 12px; border-radius:8px; align-self:flex-end; max-width:85%;">${query}</div>`;
  input.value = '';
  msgDiv.scrollTop = msgDiv.scrollHeight;
  
  const res = await post(`/companies/${companyId}/ai-chat`, { query }).catch(() => ({ reply: "Хариулт авахад алдаа гарлаа." }));
  msgDiv.innerHTML += `<div style="background:#f1f5f9; padding:8px 12px; border-radius:8px; align-self:flex-start; max-width:85%;">${res.reply.replace(/\n/g, '<br>')}</div>`;
  msgDiv.scrollTop = msgDiv.scrollHeight;
}

}

async function openCreateProjectPrompt() {
  const code = prompt("Төслийн код (д.м: PRJ-2026-01):", "PRJ-2026-01");
  if (!code) return;
  const name = prompt("Төслийн нэр:", "Шинэ оффисын барилга");
  if (!name) return;
  const budget = prompt("Төсөвт зардал (₮):", "50000000");
  if (!budget) return;
  const contract = prompt("Гэрээний дүн (₮):", "75000000");
  if (!contract) return;
  
  const res = await api(`/companies/${companyId}/projects`, 'POST', {
    project_code: code,
    project_name: name,
    budget: parseFloat(budget),
    contract_value: parseFloat(contract)
  }).catch(e => alert(e.message));
  
  if (res) {
    alert(res.message);
    openProjectCostingModal();
  }
}

    const box = $('#simResultBox');

      <td class="num" style="padding:6px; font-weight:bold; color:#16a34a;">${fmt(v.best_market_quote_mnt*100)}</td>
      <td class="num" style="padding:6px; color:${v.price_change_pct>0?'#dc2626':'#16a34a'};">${v.price_change_pct>0?'+':''}${v.price_change_pct}%</td>
    </tr>
  `).join('');
  
  $('#modalCard').innerHTML = `
    <h2><i class="fa-solid fa-tags" style="color:var(--primary)"></i> Худалдан Авалтын Үнийн Түүхэн Харьцуулалт</h2>
    <table class="grid-table" style="width:100%; font-size:12px; border:1px solid var(--border); border-radius:6px; margin-bottom:14px;">
      <thead><tr style="background:#fafafa;"><th>Барааны нэр</th><th>Нийлүүлэгч</th><th class="num">Сүүлийн PO Үнэ ₮</th><th class="num">Зах зээлийн хамгийн хямд ₮</th><th class="num">Өөрчлөлт %</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="display:flex; justify-content:flex-end;"><button class="btn secondary" onclick="hideModal()">Хаах</button></div>
  `;
  $('#modalOverlay').style.display = 'flex';
}

// 7. Bulk E-Barimt Batch Generator
function openBulkEbarimtModal() {
  $('#modalCard').style.width = '550px';
  $('#modalCard').innerHTML = `
    <h2><i class="fa-solid fa-receipt" style="color:var(--primary)"></i> И-Баримт Масс Олноор Үүсгэгч (Bulk Batch)</h2>

    <div style="display:flex; justify-content:flex-end;"><button class="btn secondary" onclick="hideModal()">Хаах</button></div>
  `;
  $('#modalOverlay').style.display = 'flex';

async function execBulkEbarimt() {
  const res = await api(`/companies/${companyId}/ebarimt/bulk-issue`, 'POST', {}).catch(e => alert(e.message));
  if (res) { alert(`Амжилттай: ${res.issued_count} И-Баримт олноор үүсгэгдэн хэвлэгдлээ! (${fmt(res.total_amount_mnt*100)})`); hideModal(); }
}

async function initApp() {
  if (!token()) {
    showAuth();
    return;
  }
  const ok = await loadCompanies().catch(() => false);
  if (ok) {
    hideAuth();
    render();
  } else {
    showAuth();
  }
}

initApp();
</script>
